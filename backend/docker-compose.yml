services:
  db:
    image: ankane/pgvector:v0.5.1
    container_name: abstrabit-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: abstrabit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d abstrabit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abstrabit-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/abstrabit
      JWT_ACCESS_SECRET: abstrabit_production_jwt_access_secret_key_32chars
      JWT_REFRESH_SECRET: abstrabit_production_jwt_refresh_secret_key_32chars
      GEMINI_API_KEY: AIzaSy_demo_gemini_api_key_placeholder
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

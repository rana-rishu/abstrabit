name: Abstrabit Enterprise Production CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Backend Dependencies
        run: cd Abstrabit/backend && npm ci
      - name: TypeScript Check Backend
        run: cd Abstrabit/backend && npx tsc --noEmit

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Frontend Dependencies
        run: cd Abstrabit/frontend && npm ci
      - name: TypeScript Check Frontend
        run: cd Abstrabit/frontend && npx tsc --noEmit
